name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate route types and check TypeScript
        run: npm run typecheck
      - name: Run offline Node tests
        run: npm test
      - name: Build production application without credentials
        run: npm run build

  collector:
    name: Collector checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            collector/requirements.lock
            collector/pyproject.toml
      - name: Install locked collector dependencies
        run: |
          python -m pip install -r collector/requirements.lock
          python -m pip install --no-deps -e ./collector
          python -m pip check
      - name: Run offline FIT and collector tests
        run: python -m unittest discover -s collector/tests -v

  browser:
    name: Browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run isolated coaching browser tests
        run: npm run test:e2e
      - name: Upload browser failure reports
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-coaching-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  required:
    name: Required checks
    needs: [web, collector, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every regression job to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          COLLECTOR_RESULT: ${{ needs.collector.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          printf 'Web: %s\nCollector: %s\nBrowser: %s\n' "$WEB_RESULT" "$COLLECTOR_RESULT" "$BROWSER_RESULT"
          if [[ "$WEB_RESULT" != 'success' || "$COLLECTOR_RESULT" != 'success' || "$BROWSER_RESULT" != 'success' ]]; then
            exit 1
          fi
